name: Huurdashboard verzamelen

on:
  schedule:
    - cron: "*/5 * * * *" # elke 5 minuten (GitHub start dit soms wat later)
  workflow_dispatch: # handmatig starten via de knop "Run workflow"

permissions:
  contents: write

concurrency:
  group: huur-verzamelaar
  cancel-in-progress: false

jobs:
  verzamel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aanbod van makelaars ophalen
        run: node huur-check.mjs
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          POSTCODES: ${{ vars.POSTCODES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEBIEDEN: ${{ vars.GEBIEDEN }}
          MAX_HUUR: ${{ vars.MAX_HUUR }}
          MIN_SLAAPKAMERS: ${{ vars.MIN_SLAAPKAMERS }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Opslaan
        run: |
          git config user.name "huur-verzamelaar"
          git config user.email "huur-verzamelaar@users.noreply.github.com"
          [ -f huur-aanbod.json ] || exit 0
          git add huur-aanbod.json
          if git diff --cached --quiet; then
            echo "Geen veranderingen."
          else
            git commit -m "Huurdashboard: aanbod bijgewerkt"
            git pull --rebase --quiet
            git push
          fi
